version: '3.8'

services:
  # База данных для очередей (Redis)
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: always

  # Воркер Celery для обработки оплат
  celery:
    build: .
    command: celery -A config worker -l info
    volumes:
      - .:/app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
    restart: always