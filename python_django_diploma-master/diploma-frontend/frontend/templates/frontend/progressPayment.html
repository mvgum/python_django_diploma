{% extends "frontend/base.html" %}
{% load static %}

{% block content %}
  <div class="Middle Middle_top">
    <div class="Middle-top">
      <div class="wrap">
        <div class="Middle-header">
          <h1 class="Middle-title">Ожидание оплаты
          </h1>
          <ul class="breadcrumbs Middle-breadcrumbs">
            <li class="breadcrumbs-item"><a href="/">Home</a>
            </li>
            <li class="breadcrumbs-item breadcrumbs-item_current"><span>Ожидание оплаты</span>
            </li>
          </ul>
        </div>
      </div>
    </div>
    <div class="Section">
      <div class="wrap">
        <div class="ProgressPayment">
          <div class="ProgressPayment-title">Ждем подтверждения оплаты платежной системой
          </div>
          <div class="ProgressPayment-icon">
            <div class="cssload-thecube">
              <div class="cssload-cube cssload-c1"></div>
              <div class="cssload-cube cssload-c2"></div>
              <div class="cssload-cube cssload-c4"></div>
              <div class="cssload-cube cssload-c3"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}

{% block mixins %}
<script>
    // Получаем ID заказа из URL (например, /progress-payment/?orderId=5)
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('orderId');

    if (orderId) {
        // Проверяем статус каждые 2 секунды
        const interval = setInterval(() => {
            fetch(`/api/order/${orderId}/`)
                .then(response => response.json())
                .then(data => {
                    // Если статус изменился с 'pending' на 'paid' или 'error'
                    if (data.status !== 'pending') {
                        clearInterval(interval);
                        // Перенаправляем в историю заказов
                        location.assign('/history-order/');
                    }
                })
                .catch(err => console.error("Ошибка проверки статуса:", err));
        }, 2000); // 2000 мс = 2 секунды
    }
</script>
{% endblock %}
